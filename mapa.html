<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CI5 · Operační mapa · The Professionals 1977–83</title>
<script>try{var t=localStorage.getItem('ci5-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── barvy: tmavý režim ── */
:root,[data-theme="dark"]{
  --bg:#0b0c0d; --map:#0a0b0c;
  --glass:rgba(17,18,20,.74); --glass-solid:#141517; --glass-hi:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08); --line:rgba(255,255,255,.07);
  --shadow:0 10px 32px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.03) inset;
  --tx:#ebe8e1; --tx2:#a39f96; --tx3:#6b6862;
  --amb:#e8a23a; --amb-tx:#e8a23a; --amb-soft:rgba(232,162,58,.14); --on-amb:#0b0c0d;
  --silver:#b9bcc0; --mk-fill:#0b0c0d;
  --st-stoji:#e8a23a; --st-prest:#7d9bb0; --st-zbor:#d0603f; --st-nezn:#8e9196;
  --input:rgba(255,255,255,.05);
}
/* ── barvy: světlý režim ── */
[data-theme="light"]{
  --bg:#F8FAFC; --map:#eef1f4;
  --glass:rgba(255,255,255,.8); --glass-solid:#ffffff; --glass-hi:rgba(15,23,42,.03);
  --border:rgba(15,23,42,.09); --line:rgba(15,23,42,.07);
  --shadow:0 10px 30px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.06);
  --tx:#0F172A; --tx2:#475569; --tx3:#94A3B8;
  --amb:#d4891f; --amb-tx:#a35f0c; --amb-soft:rgba(212,137,31,.12); --on-amb:#ffffff;
  --silver:#475569; --mk-fill:#ffffff;
  --st-stoji:#c97a12; --st-prest:#3a6f92; --st-zbor:#b8432a; --st-nezn:#64748B;
  --input:rgba(15,23,42,.04);
}
:root{
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif; --cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;
  --gap:14px; --top:64px; --lw:252px; --pw:404px; --r:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);overflow:hidden;transition:background-color .35s,color .35s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
  transition:background-color .35s,border-color .35s,box-shadow .35s,color .35s}
.lab{font:600 11px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}

/* ── mapa přes celou plochu ── */
#map{position:fixed;inset:0;background:var(--map);transition:background-color .35s}
.leaflet-container{font-family:var(--mono);background:var(--map)}
.leaflet-top.leaflet-left{top:calc(var(--top) + var(--gap) * 2);left:calc(var(--lw) + var(--gap) * 2)}
.leaflet-bottom.leaflet-right{right:calc(var(--pw) + var(--gap) * 2)}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:10px!important;overflow:hidden;box-shadow:var(--shadow)!important}
.leaflet-control-zoom a{background:var(--glass)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx2)!important;border-color:var(--line)!important;width:34px!important;height:34px!important;line-height:34px!important;transition:background-color .2s,color .2s}
.leaflet-control-zoom a:hover{color:var(--amb-tx)!important}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--tx3)!important;font-size:10px;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-control-scale-line{background:var(--glass);border-color:var(--tx3);color:var(--tx2);font:10px var(--mono)}
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.25)}
.osm-light{filter:saturate(.25) brightness(1.03)}
.leaflet-tile-pane{transition:opacity .4s}

/* ── horní lišta ── */
#bar{position:fixed;z-index:1000;top:var(--gap);left:var(--gap);right:var(--gap);height:var(--top);display:flex;align-items:center;gap:18px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.badge{font:700 13px/1 var(--cond);letter-spacing:.08em;color:var(--on-amb);background:var(--amb);padding:6px 7px 5px;border-radius:5px}
.brand b{display:block;font:600 13px var(--cond);letter-spacing:.14em;text-transform:uppercase}
.brand span{display:block;font:10px var(--mono);color:var(--tx3);white-space:nowrap}
.vr{width:1px;height:28px;background:var(--line);flex:none}
#searchbox{position:relative;flex:1;max-width:380px;min-width:160px}
#q{width:100%;font:13px var(--sans);color:var(--tx);background:var(--input);border:1px solid var(--border);border-radius:9px;padding:9px 34px 9px 34px;outline:none;transition:border-color .2s,box-shadow .2s,background-color .35s}
#q::placeholder{color:var(--tx3)}
#q:focus{border-color:var(--amb);box-shadow:0 0 0 3px var(--amb-soft)}
#searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--tx3);fill:none;stroke-width:2}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;color:var(--tx3);display:none;font-size:16px;line-height:24px}
#qx:hover{color:var(--tx);background:var(--glass-hi)}
#searchbox.has #qx{display:block}
.filters{display:flex;align-items:center;gap:14px}
.filters label{display:flex;align-items:center;gap:8px}
select{font:500 12px var(--mono);color:var(--tx);background-color:var(--input);border:1px solid var(--border);padding:8px 28px 8px 10px;border-radius:9px;appearance:none;cursor:pointer;outline:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 10px) 52%;background-size:4px 4px;background-repeat:no-repeat;transition:border-color .2s,box-shadow .2s,background-color .35s}
select:focus{border-color:var(--amb);box-shadow:0 0 0 3px var(--amb-soft)}
select option{background:var(--glass-solid);color:var(--tx)}
#dil{max-width:280px}
.stats{display:flex;gap:20px;margin-left:auto;flex:none}
.stats div{font:600 10px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.stats b{display:block;font:600 18px/1.1 var(--cond);color:var(--tx);letter-spacing:.02em;transition:color .35s}
.stats b.a{color:var(--amb-tx)}
/* přepínač režimu */
#theme{position:relative;width:58px;height:30px;border-radius:30px;background:var(--input);border:1px solid var(--border);flex:none;transition:background-color .35s,border-color .35s}
#theme .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--amb);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--ease)}
[data-theme="light"] #theme .knob{transform:translateX(28px)}
#theme svg{position:absolute;top:7px;width:14px;height:14px;fill:none;stroke:var(--tx3);stroke-width:2;transition:stroke .35s,opacity .35s}
#theme .moon{left:7px}#theme .sun{right:7px}
[data-theme="dark"] #theme .moon{stroke:var(--on-amb)}
[data-theme="light"] #theme .sun{stroke:var(--on-amb)}
#theme:focus-visible,.tog:focus-visible,.row:focus-visible{outline:2px solid var(--amb);outline-offset:2px}

/* ── vrstvy ── */
#layers{position:fixed;z-index:900;top:calc(var(--top) + var(--gap) * 2);left:var(--gap);width:var(--lw);max-height:calc(100% - var(--top) - var(--gap) * 3);overflow-y:auto;padding:6px 0 12px}
.lh{padding:14px 18px 8px}
.tog{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:11px;width:100%;padding:7px 18px;text-align:left;font-size:13px;transition:background-color .15s,color .2s}
.tog:hover{background:var(--glass-hi)}
.tog .n{font:11px var(--mono);color:var(--tx3)}
.tog.off{color:var(--tx3)}
.tog .sw{transition:opacity .2s,transform .2s}
.tog.off .sw{opacity:.25;transform:scale(.85)}
.sw{width:12px;height:12px;justify-self:center}
.sw.sq{border:2px solid var(--tx2);background:var(--mk-fill);border-radius:2px}
.sw.fl{background:var(--tx2);border-radius:2px}
.sw.ci{border:1.5px dashed var(--tx2);border-radius:50%;width:14px;height:14px}
.sw.c{border:2px solid;border-radius:2px;background:var(--mk-fill)}
.sw.hq{width:14px;height:14px;border:2px solid var(--silver);box-shadow:inset 0 0 0 2px var(--mk-fill),inset 0 0 0 4px var(--silver);border-radius:2px}
.sw.rep{width:16px;height:16px;border:2px solid var(--tx2);border-radius:2px}
.sw.lb{font:600 9px var(--mono);color:var(--tx2);width:auto}
.sw.tip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--amb);background:var(--amb-soft)}
.tipring{position:absolute;left:50%;top:50%;width:25px;height:25px;border:1.5px solid var(--amb);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:var(--amb-soft);transition:transform .18s var(--ease)}
.mk:hover .tipring{transform:translate(-50%,-50%) scale(1.15)}
.tipsec{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);border-left:3px solid var(--amb);background:var(--amb-soft)}
.tipsec .lab{color:var(--amb-tx)}
.tipsec p{margin-top:4px;font-size:13.5px;color:var(--tx)}
.sep{height:1px;background:var(--line);margin:10px 18px 2px}
.credit{padding:12px 18px 4px}
.credit p{font-size:12px;line-height:1.5;color:var(--tx2);margin-top:6px}
.credit a{white-space:nowrap;color:var(--amb-tx);text-decoration:none;border-bottom:1px solid var(--amb-soft)}
.credit a:hover{border-bottom-color:var(--amb)}
.dist{display:flex;height:5px;margin:2px 18px 6px;background:var(--line);border-radius:3px;overflow:hidden}
.dist i{display:block;height:100%;transition:width .4s var(--ease)}

/* ── značky ── */
.mk{position:relative}
.m{position:absolute;left:50%;top:50%;width:11px;height:11px;transform:translate(-50%,-50%);border:2px solid var(--c);background:var(--mk-fill);border-radius:2px;
  transition:transform .18s var(--ease),box-shadow .18s,background-color .35s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.m.v{background:var(--c)}
.m.o{width:17px;height:17px;border:1.5px dashed var(--c);border-radius:50%;background:transparent;box-shadow:none}
.m.rep{width:15px;height:15px}
.m.hq{box-shadow:0 0 0 2px var(--mk-fill),0 0 0 3.5px var(--silver),0 2px 6px rgba(0,0,0,.25)}
.mk:hover .m{transform:translate(-50%,-50%) scale(1.45)}
.m.sel{transform:translate(-50%,-50%) scale(1.4)}
.m.sel::before,.m.sel::after{content:"";position:absolute;background:var(--amb);left:50%;top:50%;animation:cross .35s var(--ease)}
.m.sel::before{width:46px;height:1px;transform:translate(-50%,-50%)}
.m.sel::after{width:1px;height:46px;transform:translate(-50%,-50%)}
@keyframes cross{from{opacity:0;width:0;height:0}}
.m.ping{animation:ping .55s var(--ease)}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 14px transparent}}
.lbl{position:absolute;left:12px;top:-8px;font:600 10px var(--mono);color:var(--tx);background:var(--glass);border:1px solid var(--border);border-radius:4px;padding:1px 5px;white-space:nowrap;display:none;pointer-events:none}
.show-lbl .lbl,.ep-mode .lbl{display:block}
/* shluky */
.cl{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);color:var(--tx);
  background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid var(--amb);box-shadow:0 0 0 4px var(--amb-soft),var(--shadow);
  transition:transform .2s var(--ease),box-shadow .2s}
.cl.hq{border-color:var(--silver)}
.marker-cluster:hover .cl{transform:scale(1.1);box-shadow:0 0 0 7px var(--amb-soft),var(--shadow)}
/* popisek při najetí */
.leaflet-tooltip.tt{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--tx);border-radius:8px;box-shadow:var(--shadow);font:500 12px var(--sans);padding:6px 10px;animation:tip .18s var(--ease)}
.leaflet-tooltip.tt:before{display:none}
.leaflet-tooltip.tt em{font:600 11px var(--mono);font-style:normal;color:var(--amb-tx);margin-right:7px}
.leaflet-tooltip.tt small{display:block;font:11px var(--mono);color:var(--tx3);margin-top:1px}
@keyframes tip{from{opacity:0;margin-top:6px}}
#coords{position:fixed;z-index:800;left:calc(var(--lw) + var(--gap) * 2);bottom:var(--gap);font:11px var(--mono);color:var(--tx2);padding:6px 10px;pointer-events:none;border-radius:8px}

/* ── spis / seznam ── */
#panel{position:fixed;z-index:900;top:calc(var(--top) + var(--gap) * 2);right:var(--gap);bottom:var(--gap);width:var(--pw);display:flex;flex-direction:column;overflow:hidden}
#scroll{overflow-y:auto;flex:1;min-height:0}
#scroll::-webkit-scrollbar,#layers::-webkit-scrollbar,.sbody::-webkit-scrollbar{width:8px}
#scroll::-webkit-scrollbar-thumb,#layers::-webkit-scrollbar-thumb,.sbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.view{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 4px}
.sum .lab b{color:var(--amb-tx)}
.grp{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--glass-solid);z-index:1;transition:background-color .35s}
.grp span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .ep{color:var(--amb-tx)}
.row{display:grid;grid-template-columns:14px 52px 1fr;gap:12px;align-items:start;padding:11px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .15s}
.row:hover{background:var(--glass-hi)}
.row:hover .n{color:var(--amb-tx)}
.row.was{background:var(--amb-soft)}
.row .d{width:9px;height:9px;margin-top:6px;border:2px solid var(--c);border-radius:2px}
.row .d.v{background:var(--c)}
.row .d.o{border-style:dashed;border-radius:50%;border-width:1.5px;width:11px;height:11px}
.row .id{font:500 11px var(--mono);color:var(--amb-tx);padding-top:3px}
.row .n{font-weight:500;transition:color .15s}
.row .m2{font:11px var(--mono);color:var(--tx3);margin-top:3px}
mark{background:var(--amb-soft);color:inherit;border-radius:3px;padding:0 1px}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 20px 0}
.fchips>.lab{margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:7px;font:500 11px var(--mono);padding:4px 7px 4px 9px;border:1px solid var(--border);border-radius:999px;color:var(--tx);text-align:left;transition:border-color .15s,color .15s}
.fchip:hover,.fchip:focus-visible{border-color:var(--amb);outline:none}
.fchip .x{color:var(--tx3);font-size:13px;line-height:1}
.fchip .ep{color:var(--amb-tx)}
.fchip.go{font-family:var(--sans);font-size:12px}
.row .why{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.4}
.row .why .more{white-space:nowrap}
.row .why em{font:500 10px var(--mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;margin-right:6px;color:var(--tx3)}
.empty{padding:32px 20px;font:12px var(--mono);color:var(--tx3)}

.hd{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
#back{font:600 11px var(--cond);color:var(--tx2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;padding:4px 0;transition:color .15s}
#back:hover{color:var(--amb-tx)}
.file{display:flex;align-items:center;gap:9px}
.file .badge{font-size:11px;padding:4px 5px 3px}
.hd h2{font:600 24px/1.2 var(--cond);letter-spacing:.01em;margin:12px 0 5px}
.addr{color:var(--tx2)}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.chip{font:600 10.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--border);border-radius:20px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;background:var(--c);border-radius:2px}
.chip.a{border-color:var(--amb);color:var(--amb-tx);background:var(--amb-soft)}
.chip.hq{border-color:var(--silver);color:var(--silver)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.meta>div{padding:12px 20px;border-right:1px solid var(--line)}
.meta>div:last-child{border-right:0}
.meta b{display:block;font:600 15px var(--mono);color:var(--tx);margin-top:3px}
.ser{display:flex;gap:3px;margin-top:6px}
.ser i{flex:1;height:15px;background:var(--line);position:relative;border-radius:3px}
.ser i.on{background:var(--amb)}
.ser i span{position:absolute;inset:0;font:600 9px/15px var(--mono);text-align:center;color:var(--tx3)}
.ser i.on span{color:var(--on-amb)}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h3{margin-bottom:10px}
.sc{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:9px 0}
.sc+.sc{border-top:1px solid var(--line)}
.sc .e{font:500 11px var(--mono);color:var(--amb-tx);padding-top:2px;text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.sc button.e:hover,.sc button.e:focus-visible{text-decoration:underline;text-underline-offset:3px;outline:none}
.sc.cur{background:var(--amb-soft);box-shadow:inset 3px 0 0 var(--amb);margin:0 -20px;padding:9px 20px}
.sc.cur+.sc{border-top:0}
.sc .t .cur-tag{color:var(--amb-tx)}
.sc.none .note{font-size:12.5px}
.epc{padding:18px 20px 6px}
.epc h3{font:600 20px/1.2 var(--cond);letter-spacing:.01em;margin:6px 0 4px}
.epc .ep{color:var(--amb-tx)}
.epc .m2{font:11px var(--mono);color:var(--tx3);margin-top:3px}
.epa{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.epa button,.epa a{font:600 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);text-decoration:none;padding:4px 0;transition:color .15s}
.epa button:hover,.epa a:hover{color:var(--amb-tx)}
.row .m3{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.4}
.sc .e small{display:block;color:var(--tx3);font-size:10px;margin-top:2px}
.sc .t{font:600 12px var(--cond);letter-spacing:.04em;color:var(--tx2);margin-bottom:2px}
.note{color:var(--tx2);font-size:13px}
.src a{display:block;font:12px var(--mono);color:var(--tx2);text-decoration:none;padding:4px 0;word-break:break-all;transition:color .15s}
.src a:hover{color:var(--amb-tx)}

/* ── spodní lišta (mobil) ── */
#sheet{display:none}
@media (max-width:1180px){:root{--lw:220px;--pw:370px}.stats{display:none}}
@media (max-width:860px){
  :root{--gap:10px;--top:auto;--sab:env(safe-area-inset-bottom,0px);--peek:calc(152px + var(--sab));--half:52vh;--full:88vh}
  @supports (height:1dvh){:root{--half:52dvh;--full:88dvh}}
  #bar{height:auto;flex-wrap:wrap;gap:10px;padding:10px 10px 10px 12px}
  .brand{flex:1}
  .vr,.stats{display:none}
  #searchbox{order:3;flex:1 0 100%;max-width:none}
  #layers,#panel,#coords{display:none}
  .leaflet-top.leaflet-left{top:124px;left:var(--gap)}
  .leaflet-control-zoom a{width:44px!important;height:44px!important;line-height:44px!important;font-size:20px!important}
  /* atribuce a měřítko nad sbalenou lištou, na plném podkladu */
  .leaflet-bottom.leaflet-right{right:0;bottom:calc(var(--peek) + 6px)}
  .leaflet-control-attribution{background:var(--glass-solid)!important;border-radius:8px 0 0 8px;padding:2px 8px!important}
  .leaflet-bottom.leaflet-right{transition:bottom .32s var(--ease),opacity .2s}
  body:has(#sheet[data-state="half"]) .leaflet-bottom.leaflet-right{bottom:calc(var(--half) + 6px)}
  /* plná lišta zakrývá mapu – atribuce se vrátí se sbalením */
  body:has(#sheet[data-state="full"]) .leaflet-bottom.leaflet-right,body:has(#sheet.drag) .leaflet-bottom.leaflet-right{opacity:0;pointer-events:none}
  #theme{width:66px;height:36px}
  #theme .knob{width:28px;height:28px}
  [data-theme="light"] #theme .knob{transform:translateX(30px)}
  #theme svg{top:10px}#theme .moon{left:10px}#theme .sun{right:10px}
  #theme::after{content:"";position:absolute;inset:-5px -2px}
  #sheet{display:flex;flex-direction:column;position:fixed;z-index:1000;left:0;right:0;bottom:0;height:var(--peek);max-height:var(--full);
    border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:var(--sab);transition:height .32s var(--ease),background-color .35s}
  #sheet[data-state="half"]{height:var(--half)}
  #sheet[data-state="full"]{height:var(--full)}
  #sheet.drag{transition:none}
  .shead{flex:none;touch-action:none;cursor:grab}
  .handle{height:26px;display:flex;align-items:center;justify-content:center}
  .handle i{display:block;width:44px;height:5px;border-radius:5px;background:var(--tx3);opacity:.55}
  .tabs{display:flex;gap:8px;padding:2px 14px 10px}
  .tabs button{flex:1;min-height:44px;font:600 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:0 9px;border-radius:10px;color:var(--tx2);border:1px solid var(--border);transition:background-color .2s,color .2s}
  .tabs button.on{background:var(--amb);color:var(--on-amb);border-color:var(--amb)}
  .sbody{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y}
  .sbody[hidden]{display:none}
  .sbody .filters{flex-direction:column;align-items:stretch;padding:12px 18px 4px;gap:10px}
  .sbody .filters label{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:10px}
  .sbody select,.sbody #dil{width:100%;max-width:none;min-height:44px}
  .sbody .tog{min-height:44px;padding-top:8px;padding-bottom:8px}
  .epa button,.epa a{min-height:44px;display:flex;align-items:center}
  .sc .e{min-height:44px}
  .fchip{min-height:36px;padding:6px 10px 6px 12px}
  .grp{background:var(--glass-solid)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<header id="bar" class="glass">
  <div class="brand"><div class="badge">CI5</div><div><b>Operační mapa</b><span>THE PROFESSIONALS · 1977–83</span></div></div>
  <div class="vr"></div>
  <div id="searchbox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Hledat místo, ulici, díl…" autocomplete="off" aria-label="Hledat">
    <button id="qx" aria-label="Vymazat">×</button>
  </div>
  <div class="filters" id="filters">
    <label><span class="lab">Série</span><select id="serie"></select></label>
    <label><span class="lab">Díl</span><select id="dil"></select></label>
  </div>
  <div class="stats">
    <div>Na mapě<b class="a" id="sCount">–</b></div>
    <div>Dílů<b id="sEps">–</b></div>
    <div>Stojí dodnes<b id="sStand">–</b></div>
  </div>
  <button id="theme" aria-label="Přepnout světlý a tmavý režim">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="knob"></span>
  </button>
</header>

<aside id="layers" class="glass"><div id="layersInner"></div></aside>
<aside id="panel" class="glass"><div id="scroll"></div></aside>
<div id="coords" class="glass">– –</div>

<section id="sheet" class="glass" data-state="peek">
  <div class="shead" id="shead">
    <div class="handle" id="handle"><i></i></div>
    <div class="tabs"><button class="on" data-tab="list">Místa</button><button data-tab="layers">Filtry a vrstvy</button></div>
  </div>
  <div class="sbody" id="sList"></div>
  <div class="sbody" id="sLayers" hidden></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const [E, LD] = await Promise.all([fetch('epizody.json').then(r => r.json()), fetch('lokace.json').then(r => r.json())]);
  const eps = E.epizody, ep = Object.fromEntries(eps.map(e => [e.kod, e]));
  const lok = LD.lokace;

  // ── odvozené vlastnosti (jen z dat) ──
  const STAV = {
    stoji: {label:'Stojí', test:s => s === 'stojí', c:'var(--st-stoji)'},
    prest: {label:'Přestavěno', test:s => s === 'přestavěno', c:'var(--st-prest)'},
    zbor:  {label:'Zbořeno / chátrá', test:s => s === 'zbořeno' || s === 'chátrá', c:'var(--st-zbor)'},
    nezn:  {label:'Stav neznámý', test:s => !s || s === 'neznámo', c:'var(--st-nezn)'}
  };
  const JIST = {
    v: {label:'Ověřeno', test:j => j === 'ověřeno', sw:'fl'},
    p: {label:'Pravděpodobné', test:j => j === 'pravděpodobné', sw:'sq'},
    o: {label:'Oblast', test:j => j === 'oblast', sw:'ci'}
  };
  lok.forEach(l => {
    l._s = Object.keys(STAV).find(k => STAV[k].test(l.stav_dnes));
    l._j = Object.keys(JIST).find(k => JIST[k].test(l.jistota)) || 'p';
    l._hq = l.zakladna_ci5 === true;
    l._rep = l.epizody.length >= 3;
    l._tip = !!l.pruvodce;
    l._q = norm([l.id, l.nazev, l.obec, l.adresa, l.pruvodce?.oblast, l.pruvodce?.proc, ...l.epizody, ...l.epizody.map(k => ep[k]?.nazev), ...l.sceny.map(s => s.popis)].join(' '));
  });
  // existující odkaz na stránku dílu (mark-1.co.uk) ze zdrojů míst
  const epUrl = {};
  lok.forEach(l => l.zdroje.forEach(z => { const m = /^mark-1\.co\.uk – (S\d\dE\d\d)$/.exec(z.nazev); if (m && !epUrl[m[1]]) epUrl[m[1]] = z.url; }));
  const POLOHA = {zdroj:'ze zdroje', ulice:'střed ulice', odhad:'přibližná', 'ověřeno':'ověřená'};
  const fmtDate = d => { if (!d) return 'neodvysíláno'; const [y, m, dd] = d.split('-'); return `${+dd}.${+m}.${y}`; };

  // ── rozvržení ──
  const mq = matchMedia('(max-width:860px)');
  const mobile = () => mq.matches;

  // ── mapa a podklady ──
  const map = L.map('map', {zoomControl:true, minZoom:8, maxZoom:18}).setView([51.53, -0.36], 11);
  L.control.scale({imperial:false, position:'bottomright'}).addTo(map);
  const ESRI = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  const ATTR = 'Tiles &copy; Esri — Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const STYLE = {dark:['World_Dark_Gray_Base', 'World_Dark_Gray_Reference'], light:['World_Light_Gray_Base', 'World_Light_Gray_Reference']};
  let tiles = [];
  function setTiles(theme){
    tiles.forEach(t => map.removeLayer(t));
    const [b, r] = STYLE[theme];
    const base = L.tileLayer(ESRI + b + '/MapServer/tile/{z}/{y}/{x}', {maxZoom:18, maxNativeZoom:16, attribution:ATTR});
    const ref = L.tileLayer(ESRI + r + '/MapServer/tile/{z}/{y}/{x}', {maxZoom:18, maxNativeZoom:16});
    let errs = 0, done = false;
    base.on('tileerror', () => {
      if (done || ++errs < 4) return;
      done = true; map.removeLayer(base); map.removeLayer(ref);
      const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, className:theme === 'dark' ? 'osm-dark' : 'osm-light',
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
      tiles = [osm];
    });
    tiles = [base.addTo(map), ref.addTo(map)];
  }
  const theme = () => document.documentElement.dataset.theme || 'dark';
  setTiles(theme());
  $('theme').onclick = () => {
    const t = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('ci5-theme', t); } catch (e) {}
    setTiles(t);
  };

  const coordsEl = $('coords');
  const dms = (v, p, n) => Math.abs(v).toFixed(4).replace('.', ',') + '° ' + (v >= 0 ? p : n);
  const showC = ll => coordsEl.textContent = dms(ll.lat, 's. š.', 'j. š.') + ' · ' + dms(ll.lng, 'v. d.', 'z. d.');
  map.on('mousemove', e => showC(e.latlng));
  map.on('moveend', () => showC(map.getCenter()));

  // ── značky + shlukování ──
  const cluster = L.markerClusterGroup({
    showCoverageOnHover:false, maxClusterRadius:44, disableClusteringAtZoom:16, spiderfyOnMaxZoom:false, animate:true,
    iconCreateFunction: c => {
      const ms = c.getAllChildMarkers(), n = ms.length, s = n < 10 ? 32 : n < 50 ? 38 : 46;
      const hq = ms.some(m => m.options.loc._hq);
      return L.divIcon({className:'marker-cluster', iconSize:[s, s], html:`<div class="cl${hq ? ' hq' : ''}">${n}</div>`});
    }
  }).addTo(map);
  const plain = L.layerGroup().addTo(map); // režim dílu: bez shlukování
  const epMode = () => !!$('dil').value;
  // body se stejnou polohou rozložit do kroužku (po rozpadu shluků)
  const groups = {};
  lok.forEach(l => { const k = l.lat.toFixed(4) + ',' + l.lng.toFixed(4); (groups[k] ||= []).push(l); });
  const mk = {};
  Object.values(groups).forEach(g => g.forEach((l, i) => {
    let ox = 0, oy = 0;
    if (g.length > 1) { const a = (2 * Math.PI * i) / g.length - Math.PI / 2, r = 9 + g.length; ox = Math.round(Math.cos(a) * r); oy = Math.round(Math.sin(a) * r); }
    const cls = ['m', l._j === 'v' ? 'v' : '', l._j === 'o' ? 'o' : '', l._rep ? 'rep' : '', l._hq ? 'hq' : ''].join(' ');
    const icon = L.divIcon({className:'mk', iconSize:[0, 0],
      html:`<div style="position:absolute;left:${ox}px;top:${oy}px">${l._tip ? '<b class="tipring"></b>' : ''}<i class="${cls}" style="--c:${STAV[l._s].c}"></i><span class="lbl">${l.id}</span></div>`});
    const m = L.marker([l.lat, l.lng], {icon, keyboard:false, riseOnHover:true, loc:l});
    m.bindTooltip(`<em>${l.id}</em>${esc(l.nazev)}<small>${esc(l.obec)} · ${l.epizody.length} ${l.epizody.length === 1 ? 'díl' : l.epizody.length < 5 ? 'díly' : 'dílů'}</small>`,
      {className:'tt', direction:'top', offset:[ox, oy - 12]});
    m.on('click', () => {
      const el = m.getElement()?.querySelector('.m');
      if (el) { el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping'); }
      show(l.id, false);
    });
    m.on('add', () => { if (current === l.id) mark(l.id); });
    mk[l.id] = m;
  }));

  // ── filtry ──
  const on = {stav:{stoji:1, prest:1, zbor:1, nezn:1}, jist:{v:1, p:1, o:1}, tip:0, hq:0, rep:0, lbl:0};
  const OBLASTI = ["Hammersmith a Shepherd's Bush", 'Kensington a North Kensington', 'Camden a Swiss Cottage', 'Islington, Crouch End a Highgate', 'Westminster a centrum', 'Jih a západ', 'Výlety za Londýn'];
  const selS = $('serie'), selD = $('dil'), q = $('q');
  const series = [...new Set(eps.map(e => e.serie))];
  selS.innerHTML = '<option value="">Vše</option>' + series.map(s => `<option value="${s}">${s}. série</option>`).join('');
  const nLoc = k => lok.filter(l => l.epizody.includes(k)).length;
  function fillDil(){
    const s = selS.value;
    selD.innerHTML = '<option value="">Vše</option>' + eps.filter(e => !s || e.serie == s).map(e =>
      `<option value="${e.kod}"${nLoc(e.kod) ? '' : ' disabled'}>${e.kod} · ${esc(e.nazev)}</option>`).join('');
  }
  const inEp = l => { const s = selS.value, d = selD.value; if (d) return l.epizody.includes(d); if (s) return l.epizody.some(k => ep[k]?.serie == s); return true; };
  const terms = () => norm(q.value).split(/\s+/).filter(Boolean);
  const epQ = {}, epText = e => epQ[e.kod] ||= norm([e.kod, e.nazev, ...(e.alt_nazvy || [])].join(' '));
  // díly, jejichž kód nebo název odpovídá hledání (jen díly s místy, bez právě vybraného)
  const epMatch = () => { const ts = terms(); if (ts.join('').length < 2) return [];
    return eps.filter(e => e.kod !== selD.value && nLoc(e.kod) && ts.every(t => epText(e).includes(t))); };
  const inQ = l => terms().every(t => l._q.includes(t));
  const layerOk = l => on.stav[l._s] && on.jist[l._j] && (!on.tip || l._tip) && (!on.hq || l._hq) && (!on.rep || l._rep);
  const visible = () => lok.filter(l => layerOk(l) && inEp(l) && inQ(l));

  function layersHTML(){
    const pool = lok.filter(l => inEp(l) && inQ(l));
    const cnt = f => pool.filter(f).length, total = pool.length || 1;
    const t = (grp, k, label, sw, n) => `<button class="tog${(grp ? on[grp][k] : on[k]) ? '' : ' off'}" data-g="${grp}" data-k="${k}" aria-pressed="${(grp ? on[grp][k] : on[k]) ? 'true' : 'false'}">${sw}<span>${label}</span><span class="n">${n}</span></button>`;
    return `<div class="lh lab">Stav dnes</div>
      <div class="dist">${Object.keys(STAV).map(k => `<i style="width:${cnt(l => l._s === k) / total * 100}%;background:${STAV[k].c}"></i>`).join('')}</div>
      ${Object.keys(STAV).map(k => t('stav', k, STAV[k].label, `<i class="sw c" style="border-color:${STAV[k].c}"></i>`, cnt(l => l._s === k))).join('')}
      <div class="sep"></div><div class="lh lab">Jistota místa</div>
      ${Object.keys(JIST).map(k => t('jist', k, JIST[k].label, `<i class="sw ${JIST[k].sw}"></i>`, cnt(l => l._j === k))).join('')}
      <div class="sep"></div><div class="lh lab">Zvýraznit</div>
      ${t('', 'tip', 'Jen výběr pro Londýn', '<i class="sw tip"></i>', cnt(l => l._tip))}
      ${t('', 'hq', 'Jen základny CI5', '<i class="sw hq"></i>', cnt(l => l._hq))}
      ${t('', 'rep', 'Jen místa ze 3+ dílů', '<i class="sw rep"></i>', cnt(l => l._rep))}
      ${t('', 'lbl', 'Kódy míst na mapě', '<i class="sw lb">L-</i>', '')}
      <div class="sep"></div>
      <div class="credit"><span class="lab">Zdroje dat</span>
        <p>Lokace a popisy scén podle <a href="http://www.mark-1.co.uk/" target="_blank" rel="noopener">mark-1.co.uk</a> – díky za léta pečlivé práce. Doplněno z IMDb, moviemaps.org a Waymarking; souřadnice ulic z OS Open Names.</p></div>`;
  }
  const onTog = e => {
    const b = e.target.closest('.tog'); if (!b) return;
    const g = b.dataset.g, k = b.dataset.k;
    if (g) on[g][k] = on[g][k] ? 0 : 1; else on[k] = on[k] ? 0 : 1;
    lblClass(); apply(k === 'tip' || k === 'hq');
  };
  $('layersInner').addEventListener('click', onTog);
  const lblClass = () => { map.getContainer().classList.toggle('show-lbl', !!on.lbl && map.getZoom() >= 14); map.getContainer().classList.toggle('ep-mode', epMode()); };
  map.on('zoomend', lblClass);

  let current = null, lastVis = [], ret = null; // ret = spis, ze kterého se přešlo do dílu
  const listEl = () => mobile() ? $('sList') : $('scroll');

  function apply(fit){
    const vis = visible(); lastVis = vis;
    cluster.clearLayers(); plain.clearLayers();
    if (epMode()) vis.forEach(l => plain.addLayer(mk[l.id]));
    else cluster.addLayers(vis.map(l => mk[l.id]));
    lblClass();
    $('sCount').textContent = vis.length;
    $('sEps').textContent = new Set(vis.flatMap(l => l.epizody.filter(k => { const s = selS.value, d = selD.value; return d ? k === d : (!s || ep[k]?.serie == s); }))).size;
    $('sStand').textContent = vis.filter(l => l._s === 'stoji').length;
    const lh = layersHTML();
    $('layersInner').innerHTML = lh;
    const sl = $('sLayers'); sl.querySelector('.lwrap') ? sl.querySelector('.lwrap').innerHTML = lh : null;
    if (fit && vis.length) fitTo(vis);
    if (current && !vis.some(l => l.id === current)) current = null;
    if (!current) list(vis);
    sync();
  }
  function fitTo(vis){
    const core = vis.filter(l => map.distance([l.lat, l.lng], [51.51, -0.30]) < 50000);
    const b = L.latLngBounds((core.length ? core : vis).map(l => [l.lat, l.lng]));
    const r = document.documentElement.getBoundingClientRect();
    const opt = mobile()
      ? {paddingTopLeft:[24, 130], paddingBottomRight:[24, 150], maxZoom:15}
      : {paddingTopLeft:[parseInt(getComputedStyle(document.documentElement).getPropertyValue('--lw')) + 50, 110],
         paddingBottomRight:[parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pw')) + 50, 40], maxZoom:15};
    map.fitBounds(b, opt);
  }

  const hl = s => { let h = esc(s); const ts = terms(); if (!ts.length) return h;
    const n = norm(s); const marks = []; ts.forEach(t => { let i = n.indexOf(t); if (i > -1) marks.push([i, i + t.length]); });
    if (!marks.length) return h; marks.sort((a, b) => a[0] - b[0]);
    let out = '', p = 0; const raw = String(s); marks.forEach(([a, b]) => { if (a < p) return; out += esc(raw.slice(p, a)) + '<mark>' + esc(raw.slice(a, b)) + '</mark>'; p = b; });
    return out + esc(raw.slice(p)); };
  // aktivní omezení výběru; každé jde vypnout jedním klikem
  function fchips(){
    const c = [], d = selD.value, s = selS.value;
    const grp = (g, MAP, name) => { const k = Object.keys(MAP), off = k.filter(x => !on[g][x]); if (!off.length || off.length === k.length) return;
      const onl = k.filter(x => on[g][x]);
      c.push([g, name + ': ' + (onl.length <= off.length ? 'jen ' + onl.map(x => MAP[x].label).join(', ') : 'bez ' + off.map(x => MAP[x].label).join(', '))]); };
    if (s && !d) c.push(['serie', s + '. série']);
    grp('stav', STAV, 'Stav'); grp('jist', JIST, 'Jistota');
    if (on.tip) c.push(['tip', 'Jen výběr pro Londýn']);
    if (on.hq) c.push(['hq', 'Jen základny CI5']);
    if (on.rep) c.push(['rep', 'Jen místa ze 3+ dílů']);
    if (!c.length) return '';
    return `<div class="fchips"><span class="lab">${c.length > 1 ? 'Platí zároveň' : 'Filtr'}</span>${c.map(([k, t]) =>
      `<button class="fchip" data-off="${k}" title="Zrušit filtr">${esc(t)}<span class="x">×</span></button>`).join('')}</div>`;
  }
  function epsug(){
    const m = epMatch(); if (!m.length) return '';
    return `<div class="fchips"><span class="lab">Přejít na díl</span>${m.slice(0, 5).map(e =>
      `<button class="fchip go" data-ep="${e.kod}" data-q=""><span class="ep">${e.kod}</span>${hl(e.nazev)}</button>`).join('')}${m.length > 5 ? `<span class="lab">+${m.length - 5}</span>` : ''}</div>`;
  }
  function offFilter(k){
    if (k === 'serie') { selS.value = ''; selS.onchange(); return; }
    if (k === 'stav' || k === 'jist') Object.keys(on[k]).forEach(x => on[k][x] = 1); else on[k] = 0;
    lblClass(); apply(k === 'tip' || k === 'hq');
  }
  // proč místo odpovídá hledání – jen údaje, které v řádku nejsou vidět (název, obec a kód zvýrazňuje řádek sám)
  function snip(txt){
    const n = norm(txt), hits = terms().map(t => [n.indexOf(t), t.length]).filter(h => h[0] > -1).sort((x, y) => x[0] - y[0]);
    if (!hits.length || txt.length <= 90) return hl(txt);
    // úryvek pokryje všechna nalezená slova, pokud jsou blízko u sebe; jinak první z nich
    const i = hits[0][0], end = Math.max(...hits.map(h => h[0] + h[1])), len = end - i <= 110 ? end - i : hits[0][1];
    let a = Math.max(0, i - 30), b = Math.min(txt.length, i + len + 40);
    if (a > 0) { const sp = txt.indexOf(' ', a); if (sp > -1 && sp < i) a = sp + 1; }
    if (b < txt.length) { const sp = txt.lastIndexOf(' ', b); if (sp > i + len) b = sp; }
    return (a > 0 ? '…' : '') + hl(txt.slice(a, b)) + (b < txt.length ? '…' : '');
  }
  function why(l){
    const ts = terms(); if (!ts.length) return '';
    const d = selD.value;
    const shown = norm([l.nazev, l.obec, l.id, d && !on.tip ? l.sceny.find(x => x.epizoda === d)?.popis : '', on.tip ? l.pruvodce?.oblast : ''].join(' '));
    let rest = ts.filter(t => !shown.includes(t));
    if (!rest.length) return '';
    const cand = [];
    if (l.adresa) cand.push({lab:'Adresa', txt:l.adresa});
    l.sceny.forEach(x => cand.push({lab:'Scéna ' + x.epizoda, txt:x.popis, snip:1}));
    l.epizody.forEach(k => cand.push({lab:'Díl', txt:k + ' · ' + (ep[k]?.nazev || '')}));
    if (l.pruvodce) cand.push({lab:'Výběr pro Londýn', txt:l.pruvodce.oblast + ' – ' + l.pruvodce.proc, snip:1});
    const out = [];
    while (rest.length && out.length < 2) {
      let best = null, bn = 0;
      cand.forEach(c => { if (out.includes(c)) return; const n = norm(c.txt), k = rest.filter(t => n.includes(t)).length; if (k > bn) { bn = k; best = c; } });
      if (!best) break;
      out.push(best); const n = norm(best.txt); rest = rest.filter(t => !n.includes(t));
    }
    // zbylá slova jen odkazem na údaj, bez dalšího úryvku
    const more = [];
    cand.forEach(c => { if (!rest.length || out.includes(c) || more.length >= 2) return; const n = norm(c.txt); if (rest.some(t => n.includes(t))) { more.push(c.lab); rest = rest.filter(t => !n.includes(t)); } });
    return out.map((c, i) => `<div class="why"><em>${c.lab}</em>${c.snip ? snip(c.txt) : hl(c.txt)}${i === out.length - 1 && more.length ? ` <span class="more">· také: ${more.join(', ')}</span>` : ''}</div>`).join('');
  }
  const dot = l => `<i class="d ${l._j === 'v' ? 'v' : ''} ${l._j === 'o' ? 'o' : ''}" style="--c:${STAV[l._s].c}"></i>`;
  function list(vis){
    const el = listEl();
    const d = selD.value, s = selS.value, by = {}, e = ep[d];
    const epc = e ? `<div class="epc">
        <div class="lab"><span class="ep">${d}</span> · ${e.serie}. série, ${e.dil}. díl</div>
        <h3>${esc(e.nazev)}</h3>
        <div class="m2">${e.vysilano ? 'vysíláno ' + fmtDate(e.vysilano) : 'neodvysíláno'} · produkční kód ${esc(e.produkcni_kod)}${e.alt_nazvy ? ' · též ' + e.alt_nazvy.map(esc).join(', ') : ''}</div>
        ${e.poznamka ? `<div class="m2">${esc(e.poznamka)}</div>` : ''}
        <div class="epa">${ret ? `<button class="ret">← Spis ${ret.p}</button>` : ''}${epUrl[d] ? `<a href="${esc(epUrl[d])}" target="_blank" rel="noopener">↗ Díl na mark-1.co.uk</a>` : ''}</div>
      </div>` : '';
    const head = epc + fchips() + epsug() + `<div class="sum"><span class="lab"><b>${vis.length}</b> míst${q.value.trim() ? ' odpovídá hledání' : ''}</span></div>`;
    if (!vis.length) { el.innerHTML = `<div class="view">${head}<div class="empty">Žádná místa v aktuálním výběru.</div></div>`; bindRet(el); return; }
    if (on.tip) vis.forEach(l => (by[l.pruvodce.oblast] ||= []).push(l));
    else vis.forEach(l => { const k = d || l.epizody.find(x => !s || ep[x]?.serie == s); (by[k] ||= []).push(l); });
    const keys = on.tip ? OBLASTI.filter(k => by[k]) : Object.keys(by).sort();
    const sc = l => d && !on.tip ? l.sceny.find(x => x.epizoda === d) : null;
    el.innerHTML = `<div class="view">${head}` + keys.map(k => `
      ${e && !on.tip ? '' : `<div class="grp lab">${on.tip ? `<span><span class="ep">${esc(k)}</span></span>` : `<span><span class="ep">${k}</span> · ${esc(ep[k]?.nazev)}</span>`}<span>${by[k].length}</span></div>`}
      ${by[k].map(l => `<div class="row${ret && ret.p === l.id ? ' was' : ''}" tabindex="0" data-id="${l.id}">${dot(l)}<div class="id">${l.id}</div>
        <div><div class="n">${hl(l.nazev)}</div><div class="m2">${hl(l.obec)}${l.epizody.length > 1 ? ' · ' + l.epizody.length + ' dílů' : ''}${l._hq ? ' · základna CI5' : ''}${l._tip && !on.tip ? ' · výběr pro Londýn' : ''}</div>${sc(l) ? `<div class="m3">${hl(sc(l).popis)}</div>` : ''}${why(l)}</div></div>`).join('')}`).join('') + '</div>';
    el.scrollTop = 0;
    bindRet(el);
  }
  const bindRet = el => { const b = el.querySelector('.ret'); if (b) b.onclick = backToPlace; };

  function mark(id){
    document.querySelectorAll('.m.sel').forEach(e => e.classList.remove('sel'));
    const m = id && mk[id]; if (!m) return;
    m.getElement()?.querySelector('.m')?.classList.add('sel');
  }

  let saved = null; // stav seznamu a mapy před otevřením spisu
  function show(id, pan){
    const l = lok.find(x => x.id === id); if (!l) return;
    if (current === null && !restoring) saved = {scroll:listEl().scrollTop, center:map.getCenter(), zoom:map.getZoom(), id};
    current = id;
    const m = mk[id];
    const focus = () => {
      map.setView([l.lat, l.lng], Math.max(map.getZoom(), 16), {animate:false});
      if (mobile()) map.panBy([0, innerHeight * .22], {animate:false});
      mark(id);
    };
    if (pan && cluster.hasLayer(m)) cluster.zoomToShowLayer(m, focus);
    else if (pan) focus();
    else mark(id);
    const first = l.epizody.map(k => ep[k]).filter(e => e?.vysilano).sort((a, b) => a.vysilano.localeCompare(b.vysilano))[0];
    const perS = [1, 2, 3, 4, 5].map(s => l.epizody.filter(k => ep[k]?.serie === s).length);
    const st = STAV[l._s];
    const d = selD.value;
    // scéna vybraného dílu první a zvýrazněná, ostatní v původním pořadí
    const scs = [...l.sceny.filter(x => x.epizoda === d), ...l.sceny.filter(x => x.epizoda !== d)];
    const scHTML = (d && l.epizody.includes(d) && !l.sceny.some(x => x.epizoda === d)
        ? `<div class="sc cur none"><span class="e">${d}</span><div class="note">K vybranému dílu není u tohoto místa popis scény.</div></div>` : '') +
      scs.map(x => `
        <div class="sc${x.epizoda === d ? ' cur' : ''}"><button class="e" data-ep="${x.epizoda}" title="Místa dílu ${x.epizoda}">${x.epizoda}<small>${fmtDate(ep[x.epizoda]?.vysilano)}</small></button>
        <div><div class="t">${esc(ep[x.epizoda]?.nazev)}${x.epizoda === d ? '<span class="cur-tag"> · vybraný díl</span>' : ''}</div>${esc(x.popis)}</div></div>`).join('');
    const el = listEl();
    el.innerHTML = `<div class="view">
      <div class="hd">
        <button id="back">← Seznam</button>
        <div class="file"><span class="badge">CI5</span><span class="lab">Spis ${l.id} · sektor ${esc(l.obec)}</span></div>
        <h2>${esc(l.nazev)}</h2>
        <div class="addr">${l.adresa ? esc(l.adresa) : 'Adresa neuvedena'}</div>
        <div class="chips">
          <span class="chip${l._j === 'v' ? ' a' : ''}">${esc(l.jistota)}</span>
          <span class="chip" style="--c:${st.c}"><i></i>${st.label}</span>
          <span class="chip">poloha: ${POLOHA[l.souradnice] ?? esc(l.souradnice)}</span>
          ${l._hq ? '<span class="chip hq">základna CI5</span>' : ''}
        </div>
      </div>
      ${l._tip ? `<div class="tipsec"><span class="lab">Výběr pro Londýn · ${esc(l.pruvodce.oblast)}</span><p>${esc(l.pruvodce.proc)}</p></div>` : ''}
      <div class="meta">
        <div><span class="lab">Dílů</span><b>${l.epizody.length}</b></div>
        <div><span class="lab">Poprvé</span><b>${first ? fmtDate(first.vysilano) : '—'}</b></div>
        <div><span class="lab">Série</span><div class="ser">${perS.map((n, i) => `<i class="${n ? 'on' : ''}" title="${i + 1}. série: ${n}"><span>${i + 1}</span></i>`).join('')}</div></div>
      </div>
      <div class="sec"><h3 class="lab">Scény</h3>${scHTML}</div>
      ${l.stav_poznamka ? `<div class="sec"><h3 class="lab">Dnes</h3><div class="note">${esc(l.stav_poznamka)}</div></div>` : ''}
      ${l.poznamka ? `<div class="sec"><h3 class="lab">Poznámka ke zdrojům</h3><div class="note">${esc(l.poznamka)}</div></div>` : ''}
      <div class="sec src"><h3 class="lab">Zdroje</h3>${l.zdroje.map(z => `<a href="${esc(z.url)}" target="_blank" rel="noopener">↗ ${esc(z.nazev)}</a>`).join('')}</div>
    </div>`;
    el.scrollTop = 0;
    $('back').onclick = close;
    if (mobile()) { const moving = sheet.dataset.state === 'peek'; setTab('list'); if (moving) sheet.dataset.state = 'half'; if (d) revealCur(el, id, moving); }
    sync();
  }
  // mobil: posunout obsah lišty jen o tolik, aby byla vidět scéna vybraného dílu (hlavička zůstává hned nad ní)
  let revealTok = 0;
  function revealCur(el, id, moving){
    const tok = ++revealTok; let user = false;
    const stop = () => { user = true; };
    el.addEventListener('pointerdown', stop, {once:true, passive:true});
    el.addEventListener('wheel', stop, {once:true, passive:true});
    const run = () => {
      if (tok !== revealTok || user || current !== id || !mobile() || sheet.classList.contains('drag')) return;
      const c = el.querySelector('.sc.cur'); if (!c) return;
      const er = el.getBoundingClientRect(), cr = c.getBoundingClientRect();
      const top = cr.top - er.top + el.scrollTop;
      let t = top + cr.height - el.clientHeight + 16;   // spodní okraj scény těsně nad spodkem lišty
      if (t > top - 8) t = top - 8;                       // scéna vyšší než lišta: zarovnat začátek
      if (t > el.scrollTop + 1) el.scrollTo({top:t, behavior:'smooth'});
    };
    if (!moving) requestAnimationFrame(() => requestAnimationFrame(run)); // po vykreslení (lišta se nehýbe)
    const onEnd = e => { if (e.target === sheet && e.propertyName === 'height') { sheet.removeEventListener('transitionend', onEnd); run(); } };
    sheet.addEventListener('transitionend', onEnd);                   // po změně výšky lišty
    setTimeout(() => { sheet.removeEventListener('transitionend', onEnd); run(); }, 450); // pojistka
  }
  // návrat ze spisu do seznamu: pozice seznamu, výřez mapy, zvýraznění řádku
  function applyBase(s){
    if (!s) return;
    const el = listEl();
    el.scrollTop = s.scroll;
    el.querySelectorAll('.row.was').forEach(r => r.classList.remove('was'));
    const row = el.querySelector(`.row[data-id="${s.id}"]`);
    if (row) { row.classList.add('was'); const r = row.getBoundingClientRect(), b = el.getBoundingClientRect(); if (r.top < b.top || r.bottom > b.bottom) row.scrollIntoView({block:'nearest'}); }
    const c = L.latLng(s.center);
    if (!map.getCenter().equals(c) || map.getZoom() !== s.zoom) map.setView(c, s.zoom, {animate:true});
  }
  function close(){
    const target = {s:selS.value, d:selD.value, p:null};
    if (hs?.prev && key(hs.prev) === key(target)) { history.back(); return; } // krok zpět v historii, ne nový záznam
    const b = saved; saved = null;
    current = null; mark(null); list(lastVis); applyBase(b); sync();
  }

  // ── přechod místo → díl a zpět ──
  function goEp(k){
    if (!ep[k]) return;
    if (k === selD.value) { if (current) close(); return; }
    ret = current ? {s:selS.value, d:selD.value, p:current, base:saved} : null;
    selS.value = String(ep[k].serie); fillDil(); selD.value = k;
    current = null; saved = null; mark(null); apply(true);
    if (ret) mark(ret.p);
  }
  function backToPlace(){
    if (!ret) return;
    if (hs?.prev && key(hs.prev) === key(ret)) { history.back(); return; }
    restore({s:ret.s, d:ret.d, p:ret.p, base:ret.base, ret:null}); sync();
  }

  // ── stav v URL: #L-142, #S03E05, #S03E05/L-142 ──
  let hs = null, restoring = false; // hs = stav aktuálního záznamu historie
  const key = st => `${st.s}|${st.d}|${st.p || ''}`;
  const hashOf = st => [st.d, st.p].filter(Boolean).join('/');
  const urlOf = st => location.pathname + location.search + (hashOf(st) ? '#' + hashOf(st) : '');
  function parseHash(){
    const m = /^#(?:(S\d\dE\d\d))?\/?(?:(L-\d+))?$/i.exec(decodeURIComponent(location.hash));
    if (!m || (!m[1] && !m[2])) return null;
    const d = m[1]?.toUpperCase(), p = m[2]?.toUpperCase();
    if (d && !ep[d]) return null;
    if (p && !lok.some(l => l.id === p)) return null;
    return {s:d ? String(ep[d].serie) : '', d:d || '', p:p || null, base:null, ret:null};
  }
  function sync(){
    if (restoring || !hs) return;
    const st = {s:selS.value, d:selD.value, p:current};
    if (key(hs) === key(st)) return;
    const ns = {...st, base:current ? saved : null, ret, prev:{s:hs.s, d:hs.d, p:hs.p}};
    history.pushState(ns, '', urlOf(ns)); hs = ns;
  }
  function restore(st){
    restoring = true;
    const old = hs, filt = st.s !== selS.value || st.d !== selD.value;
    ret = st.ret || null;
    if (filt) { selS.value = st.s; fillDil(); selD.value = st.d; current = null; mark(null); apply(!st.p); }
    if (st.p) { saved = st.base || null; if (st.p !== current) show(st.p, true); }
    else if (current || filt) {
      current = null; saved = null; mark(null); list(lastVis);
      if (!filt && old?.p) applyBase(old.base);
      else if (ret) mark(ret.p);
    }
    restoring = false;
  }
  addEventListener('popstate', e => {
    const st = e.state || parseHash() || {s:'', d:'', p:null, base:null, ret:null};
    restore(st);
    hs = st.prev !== undefined ? st : {...st, prev:null};
    if (!e.state) history.replaceState(hs, '', hashOf(st) ? urlOf(st) : location.href);
  });

  const onRow = e => {
    const f = e.target.closest('[data-off]'); if (f) { offFilter(f.dataset.off); return; }
    const b = e.target.closest('[data-ep]'); if (b) { if (b.dataset.q !== undefined) q.value = ''; goEp(b.dataset.ep); return; }
    const r = e.target.closest('.row'); if (r) show(r.dataset.id, true);
  };
  $('scroll').addEventListener('click', onRow);
  $('sList').addEventListener('click', onRow);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && current) close();
    if (e.key === 'Enter' && e.target.classList?.contains('row')) show(e.target.dataset.id, true);
  });
  selS.onchange = () => { fillDil(); current = null; saved = null; ret = null; mark(null); apply(true); };
  selD.onchange = () => { current = null; saved = null; ret = null; mark(null); apply(true); };
  let qt;
  q.addEventListener('input', () => {
    $('searchbox').classList.toggle('has', !!q.value);
    clearTimeout(qt); qt = setTimeout(() => { current = null; saved = null; mark(null); apply(false); if (mobile() && q.value && sheet.dataset.state === 'peek') sheet.dataset.state = 'half'; }, 90);
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && lastVis.length) { fitTo(lastVis); if (lastVis.length === 1) show(lastVis[0].id, true); } });
  $('qx').onclick = () => { q.value = ''; q.dispatchEvent(new Event('input')); q.focus(); };

  // ── spodní lišta na mobilu ──
  const sheet = $('sheet');
  function setTab(t){
    sheet.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $('sList').hidden = t !== 'list'; $('sLayers').hidden = t !== 'layers';
  }
  sheet.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    setTab(b.dataset.tab); if (sheet.dataset.state === 'peek') sheet.dataset.state = 'half';
  });
  $('sLayers').addEventListener('click', onTog);
  // tažení za celé záhlaví (úchyt + záložky); ťuknutí na úchyt přepíná polohy, ťuknutí na záložku zůstává klikem
  const states = ['peek', 'half', 'full'];
  const shead = $('shead');
  let drag = null, swallowClick = false;
  shead.addEventListener('pointerdown', e => {
    drag = {y:e.clientY, h:sheet.getBoundingClientRect().height, id:e.pointerId, moved:false, onHandle:!!e.target.closest('.handle')};
  });
  shead.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > 6) { drag.moved = true; sheet.classList.add('drag'); try { shead.setPointerCapture(drag.id); } catch (_) {} }
    if (drag.moved) {
      const min = shead.offsetHeight, max = innerHeight * .88;
      sheet.style.height = Math.min(Math.max(drag.h - dy, min), max) + 'px';
    }
  });
  const endDrag = () => {
    if (!drag) return;
    if (drag.moved) {
      const h = sheet.getBoundingClientRect().height, vh = innerHeight;
      sheet.classList.remove('drag'); sheet.style.height = '';
      sheet.dataset.state = h > vh * .7 ? 'full' : h > vh * .3 ? 'half' : 'peek';
      swallowClick = true; setTimeout(() => swallowClick = false, 0);
    } else if (drag.onHandle) {
      sheet.dataset.state = states[(states.indexOf(sheet.dataset.state) + 1) % 3];
    }
    drag = null;
  };
  shead.addEventListener('pointerup', endDrag);
  shead.addEventListener('pointercancel', endDrag);
  shead.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);

  // přesun ovládacích prvků mezi desktopem a mobilem
  function placeUI(){
    const f = $('filters');
    if (mobile()) {
      if (!$('sLayers').contains(f)) { $('sLayers').innerHTML = ''; $('sLayers').append(f); const w = document.createElement('div'); w.className = 'lwrap'; $('sLayers').append(w); }
    } else if (!$('bar').contains(f)) { $('searchbox').after(f); }
    apply(false);
    if (current) show(current, false);
  }
  mq.addEventListener('change', placeUI);

  fillDil();
  const h0 = parseHash();
  restoring = true;
  if (h0?.d) { selS.value = h0.s; fillDil(); selD.value = h0.d; }
  placeUI();
  fitTo(lastVis);
  if (h0?.p) show(h0.p, true);
  restoring = false;
  hs = {s:selS.value, d:selD.value, p:current, base:null, ret:null, prev:null};
  history.replaceState(hs, '', h0 ? urlOf(hs) : location.href);
})();
</script>
</body>
