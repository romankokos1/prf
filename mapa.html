<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI5 · Lokace · The Professionals 1977–83</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e0f; --panel:#141516; --line:#26282a; --line2:#1c1d1f;
  --tx:#e6e3dc; --tx2:#9a968d; --tx3:#64615b;
  --amb:#e8a23a; --amb-d:#8a6123;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --pw:380px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);overflow:hidden}
#app{display:grid;grid-template-columns:1fr var(--pw);grid-template-rows:44px 1fr;height:100%}

/* top bar */
#bar{grid-column:1/3;display:flex;align-items:center;gap:20px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
#bar .mark{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--tx)}
#bar .mark i{display:block;width:10px;height:10px;background:var(--amb)}
#bar .mark span{color:var(--tx3);font-weight:400}
#bar .sep{flex:1}
#bar label{color:var(--tx3);text-transform:uppercase;font-size:11px;display:flex;align-items:center;gap:8px}
select{font:500 12px var(--mono);color:var(--tx);background:var(--panel);border:1px solid var(--line);padding:5px 26px 5px 8px;border-radius:0;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
select:focus{outline:1px solid var(--amb);outline-offset:-1px}
#dil{max-width:300px}
#count{color:var(--tx2);min-width:84px;text-align:right}
#count b{color:var(--amb);font-weight:600}

/* map */
#map{grid-row:2;background:#0b0c0d}
.leaflet-container{font-family:var(--mono)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--tx2)!important;border-color:var(--line)!important;border-radius:0!important}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:0!important}
.leaflet-control-attribution{background:rgba(13,14,15,.8)!important;color:var(--tx3)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--tx2)!important}
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.3)}
.pt{width:12px;height:12px;border:2px solid var(--amb);background:var(--bg);transition:transform .1s}
.pt.v{background:var(--amb)}
.pt.o{border-radius:50%;border-style:dashed;width:16px;height:16px;border-width:1.5px;background:transparent}
.pt.dim{opacity:.18}
.pt.sel{transform:scale(1.5);box-shadow:0 0 0 3px rgba(232,162,58,.25)}
.mk:hover .pt{transform:scale(1.35)}
.leaflet-tooltip.tt{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:0;box-shadow:none;font:500 11px var(--mono);padding:3px 7px}
.leaflet-tooltip.tt:before{display:none}

/* panel */
#panel{grid-row:2;grid-column:2;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#legend{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
#legend span{display:flex;align-items:center;gap:6px}
#legend .pt{width:9px;height:9px;border-width:1.5px}
#legend .pt.o{width:11px;height:11px}
#scroll{overflow-y:auto;flex:1;min-height:0}
#scroll::-webkit-scrollbar{width:8px}#scroll::-webkit-scrollbar-thumb{background:var(--line)}

/* list */
.grp{font:600 11px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:hover{background:#1a1b1d}
.row .id{font:500 11px var(--mono);color:var(--amb);padding-top:2px}
.row .n{font-weight:500;color:var(--tx)}
.row .m{font:11px var(--mono);color:var(--tx3);margin-top:2px}

/* detail */
#det .hd{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
#back{font:500 11px var(--mono);color:var(--tx2);background:none;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;padding:0;margin-bottom:14px}
#back:hover{color:var(--amb)}
.code{font:600 12px var(--mono);color:var(--amb);letter-spacing:.06em}
#det h2{font:600 19px/1.25 var(--sans);margin:4px 0 6px}
.addr{color:var(--tx2)}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border:1px solid var(--line);color:var(--tx2)}
.tag.a{border-color:var(--amb-d);color:var(--amb)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line2)}
.sec h3{font:600 11px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sc{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:6px 0}
.sc+.sc{border-top:1px solid var(--line2)}
.sc .e{font:500 11px var(--mono);color:var(--amb);padding-top:2px}
.sc .t{font:500 12px var(--sans);color:var(--tx2);margin-bottom:2px}
.kv{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:13px}
.kv+.kv{margin-top:4px}
.kv dt{font:11px var(--mono);color:var(--tx3);padding-top:2px;text-transform:uppercase}
.note{color:var(--tx2);font-size:13px}
.src a{display:block;font:12px var(--mono);color:var(--tx2);text-decoration:none;padding:3px 0;word-break:break-all}
.src a:hover{color:var(--amb)}
.empty{padding:28px 16px;font:12px var(--mono);color:var(--tx3)}

@media (max-width:820px){
  :root{--pw:100%}
  #app{grid-template-columns:1fr;grid-template-rows:auto 55% 45%}
  #bar{grid-column:1;flex-wrap:wrap;gap:8px 14px;padding:8px 12px}
  #bar .sep{display:none}
  #dil{max-width:200px}
  #panel{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="mark"><i></i>CI5 / LOKACE <span>THE PROFESSIONALS · LWT 1977–83</span></div>
    <div class="sep"></div>
    <label>Série <select id="serie"></select></label>
    <label>Díl <select id="dil"></select></label>
    <div id="count"></div>
  </header>
  <div id="map"></div>
  <aside id="panel">
    <div id="legend">
      <span><i class="pt v"></i>ověřeno</span>
      <span><i class="pt"></i>pravděpodobné</span>
      <span><i class="pt o"></i>oblast</span>
    </div>
    <div id="scroll"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function(){
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const [E, LD] = await Promise.all([
    fetch('epizody.json').then(r => r.json()),
    fetch('lokace.json').then(r => r.json())
  ]);
  const eps = E.epizody, ep = Object.fromEntries(eps.map(e => [e.kod, e]));
  const lok = LD.lokace;
  const POLOHA = {zdroj:'podle zdroje', ulice:'střed ulice', odhad:'přibližná', 'ověřeno':'ověřená'};
  const JCLS = {'ověřeno':'v', 'pravděpodobné':'', 'oblast':'o'};

  // map
  const map = L.map('map', {zoomControl:true, attributionControl:true, preferCanvas:false}).setView([51.56, -0.47], 11);
  const ESRI = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  const base = L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:16, maxNativeZoom:16,
    attribution:'Tiles &copy; Esri — Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  const labels = L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:16, maxNativeZoom:16}).addTo(map);
  // fallback: OSM ztmavená filtrem, pokud Esri nenaběhne
  let errs = 0, switched = false;
  base.on('tileerror', () => {
    if (switched || ++errs < 4) return;
    switched = true; map.removeLayer(base); map.removeLayer(labels);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, className:'osm-dark',
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
  });

  // spread markers sharing (almost) the same point
  const groups = {};
  lok.forEach(l => { const k = l.lat.toFixed(4)+','+l.lng.toFixed(4); (groups[k] ||= []).push(l); });
  const markers = {};
  Object.values(groups).forEach(g => g.forEach((l, i) => {
    let ox = 0, oy = 0;
    if (g.length > 1) { const a = (2*Math.PI*i)/g.length - Math.PI/2; ox = Math.round(Math.cos(a)*11); oy = Math.round(Math.sin(a)*11); }
    const cls = JCLS[l.jistota] ?? '';
    const sz = cls === 'o' ? 16 : 12;
    const icon = L.divIcon({className:'mk', html:`<div class="pt ${cls}" data-id="${l.id}"></div>`, iconSize:[sz,sz], iconAnchor:[sz/2 - ox, sz/2 - oy]});
    const m = L.marker([l.lat, l.lng], {icon, keyboard:false}).addTo(map);
    m.bindTooltip(`${l.id}  ${esc(l.nazev)}`, {className:'tt', direction:'top', offset:[ox, oy - 8]});
    m.on('click', () => show(l.id, false));
    markers[l.id] = m;
  }));

  // filters
  const selS = document.getElementById('serie'), selD = document.getElementById('dil');
  const series = [...new Set(eps.map(e => e.serie))];
  selS.innerHTML = '<option value="">Vše</option>' + series.map(s => `<option value="${s}">${s}</option>`).join('');
  const nLoc = k => lok.filter(l => l.epizody.includes(k)).length;
  function fillDil(){
    const s = selS.value;
    const list = eps.filter(e => !s || e.serie == s);
    selD.innerHTML = '<option value="">Vše</option>' + list.map(e => {
      const n = nLoc(e.kod);
      return `<option value="${e.kod}"${n ? '' : ' disabled'}>${e.kod} · ${esc(e.nazev)}${n ? '' : ' (—)'}</option>`;
    }).join('');
  }
  const inFilter = l => {
    const s = selS.value, d = selD.value;
    if (d) return l.epizody.includes(d);
    if (s) return l.epizody.some(k => ep[k]?.serie == s);
    return true;
  };

  let current = null;
  const scroll = document.getElementById('scroll');

  function apply(fit){
    const vis = lok.filter(inFilter);
    lok.forEach(l => {
      const el = markers[l.id].getElement()?.querySelector('.pt');
      if (el) el.classList.toggle('dim', !inFilter(l));
      markers[l.id].setZIndexOffset(inFilter(l) ? 500 : 0);
    });
    document.getElementById('count').innerHTML = `<b>${vis.length}</b> / ${lok.length}`;
    if (fit && vis.length) map.fitBounds(L.latLngBounds(vis.map(l => [l.lat, l.lng])), {padding:[40,40], maxZoom:15});
    if (!current) list(vis);
  }

  function list(vis){
    if (!vis.length){ scroll.innerHTML = '<div class="empty">Žádná místa.</div>'; return; }
    const d = selD.value;
    // group by first episode in filter
    const by = {};
    vis.forEach(l => {
      const k = d || l.epizody.filter(x => !selS.value || ep[x]?.serie == selS.value)[0];
      (by[k] ||= []).push(l);
    });
    const keys = Object.keys(by).sort();
    scroll.innerHTML = keys.map(k => `
      <div class="grp"><span>${k} · ${esc(ep[k]?.nazev)}</span><span>${by[k].length}</span></div>
      ${by[k].map(l => `
        <div class="row" data-id="${l.id}">
          <div class="id">${l.id}</div>
          <div><div class="n">${esc(l.nazev)}</div>
          <div class="m">${esc(l.obec)}${l.epizody.length > 1 ? ' · ' + l.epizody.length + ' dílů' : ''}</div></div>
        </div>`).join('')}`).join('');
    scroll.scrollTop = 0;
  }

  function mark(id){
    document.querySelectorAll('.pt.sel').forEach(e => e.classList.remove('sel'));
    if (id) markers[id].getElement()?.querySelector('.pt')?.classList.add('sel');
  }

  function show(id, pan){
    const l = lok.find(x => x.id === id); if (!l) return;
    current = id; mark(id);
    if (pan) map.setView([l.lat, l.lng], Math.max(map.getZoom(), 15));
    const sceny = l.sceny.map(s => `
      <div class="sc"><div class="e">${s.epizoda}</div>
      <div><div class="t">${esc(ep[s.epizoda]?.nazev)}</div>${esc(s.popis)}</div></div>`).join('');
    const stav = l.stav_dnes && l.stav_dnes !== 'neznámo' ? l.stav_dnes : null;
    scroll.innerHTML = `<div id="det">
      <div class="hd">
        <button id="back">← Seznam</button>
        <div class="code">${l.id}</div>
        <h2>${esc(l.nazev)}</h2>
        <div class="addr">${l.adresa ? esc(l.adresa) + ', ' : ''}${esc(l.obec)}</div>
        <div class="tags">
          <span class="tag${l.jistota === 'ověřeno' ? ' a' : ''}">${esc(l.jistota)}</span>
          <span class="tag">poloha: ${POLOHA[l.souradnice] ?? esc(l.souradnice)}</span>
          ${stav ? `<span class="tag">${esc(stav)}</span>` : ''}
        </div>
      </div>
      <div class="sec"><h3>Scény</h3>${sceny}</div>
      ${l.stav_poznamka ? `<div class="sec"><h3>Dnes</h3><div class="note">${esc(l.stav_poznamka)}</div></div>` : ''}
      ${l.poznamka ? `<div class="sec"><h3>Poznámka</h3><div class="note">${esc(l.poznamka)}</div></div>` : ''}
      <div class="sec src"><h3>Zdroje</h3>${l.zdroje.map(z => `<a href="${esc(z.url)}" target="_blank" rel="noopener">↗ ${esc(z.nazev)}</a>`).join('')}</div>
    </div>`;
    scroll.scrollTop = 0;
    document.getElementById('back').onclick = () => { current = null; mark(null); apply(false); };
  }

  scroll.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) show(r.dataset.id, true); });
  selS.onchange = () => { fillDil(); current = null; mark(null); apply(true); };
  selD.onchange = () => { current = null; mark(null); apply(true); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && current){ current = null; mark(null); apply(false); } });

  fillDil();
  apply(true);
})();
</script>
</body>
</html>
